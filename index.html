<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITGC Compliance Dashboard | Enterprise GRC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .sidebar-item-active {
            background-color: #1e293b;
            color: #f8fafc;
            border-left: 4px solid #3b82f6;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-900">

    <!-- Sidebar -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col shrink-0">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold text-white flex items-center">
                <svg class="w-8 h-8 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                GRC Sentinel
            </h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">ITGC Compliance Dashboard</p>
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav">
            <!-- Navigation items will be injected here -->
        </nav>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
            &copy; 2023 Senior IT Audit Director Portal
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <h2 id="current-domain-title" class="text-lg font-semibold text-slate-800">Executive Summary</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-slate-500">Last updated: <span id="last-updated">Today</span></span>
                <button class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition shadow-sm">Export Report</button>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto p-8">
            <!-- Executive Summary Section -->
            <div id="executive-summary" class="mb-8">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Chart Card -->
                    <div class="lg:col-span-1 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Overall Compliance Status</h3>
                        <div class="relative h-64 flex items-center justify-center">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="lg:col-span-2 grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-slate-500 font-medium">Total Controls</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="total-controls-count">17</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-green-600 font-medium">Passed</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="passed-count">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-red-600 font-medium">Failed</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="failed-count">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-yellow-400">
                            <p class="text-sm text-yellow-600 font-medium">In Progress</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="progress-count">0</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-slate-400">
                            <p class="text-sm text-slate-400 font-medium">Not Tested</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="not-tested-count">17</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-slate-400 font-medium">N/A</p>
                            <p class="text-3xl font-bold text-slate-900 mt-1" id="na-count">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Table Section -->
            <div id="controls-section" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Control ID</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Control Description</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-48">Status</th>
                            <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Last Reviewer</th>
                        </tr>
                    </thead>
                    <tbody id="controls-table-body" class="divide-y divide-slate-100">
                        <!-- Controls will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // DATA STRUCTURE
        const domains = [
            {
                id: 'logical-access',
                name: 'Access to Programs and Data',
                controls: [
                    { id: 'AC-01', description: 'New User Provisioning', status: 'Not Tested' },
                    { id: 'AC-02', description: 'User Access Terminations', status: 'Not Tested' },
                    { id: 'AC-03', description: 'Periodic User Access Reviews (UAR)', status: 'Not Tested' },
                    { id: 'AC-04', description: 'Privileged Access Management (PAM)', status: 'Not Tested' },
                    { id: 'AC-05', description: 'Password Configuration & Authentication', status: 'Not Tested' }
                ]
            },
            {
                id: 'change-management',
                name: 'Program Changes',
                controls: [
                    { id: 'CM-01', description: 'Change Request & Authorization', status: 'Not Tested' },
                    { id: 'CM-02', description: 'Pre-implementation Testing & Approvals', status: 'Not Tested' },
                    { id: 'CM-03', description: 'Segregation of Duties (Developer vs. Migrator)', status: 'Not Tested' },
                    { id: 'CM-04', description: 'Emergency Change Procedures', status: 'Not Tested' }
                ]
            },
            {
                id: 'system-implementations',
                name: 'Program Development',
                controls: [
                    { id: 'SD-01', description: 'Systems Development Life Cycle (SDLC) Methodology', status: 'Not Tested' },
                    { id: 'SD-02', description: 'Data Migration & Verification', status: 'Not Tested' },
                    { id: 'SD-03', description: 'Post-Implementation Review', status: 'Not Tested' }
                ]
            },
            {
                id: 'computer-operations',
                name: 'Computer Operations',
                controls: [
                    { id: 'CO-01', description: 'Data Backup and Recovery', status: 'Not Tested' },
                    { id: 'CO-02', description: 'Batch Job Scheduling and Monitoring', status: 'Not Tested' },
                    { id: 'CO-03', description: 'Incident and Problem Management', status: 'Not Tested' }
                ]
            },
            {
                id: 'environmental-security',
                name: 'Physical & Environmental Security',
                controls: [
                    { id: 'PE-01', description: 'Data Center Physical Access Control', status: 'Not Tested' },
                    { id: 'PE-02', description: 'Environmental Protections (Fire, HVAC, UPS)', status: 'Not Tested' }
                ]
            }
        ];

        let currentDomainId = 'executive';
        let statusChart = null;

        const statusOptions = ["Not Tested", "Pass", "Fail", "In Progress", "N/A"];
        const statusColors = {
            "Not Tested": "bg-slate-100 text-slate-600",
            "Pass": "bg-green-100 text-green-700",
            "Fail": "bg-red-100 text-red-700",
            "In Progress": "bg-yellow-100 text-yellow-700",
            "N/A": "bg-slate-100 text-slate-400"
        };

        const chartColors = {
            "Pass": "#10b981",
            "Fail": "#ef4444",
            "In Progress": "#f59e0b",
            "Not Tested": "#94a3b8",
            "N/A": "#e2e8f0"
        };

        // DOM ELEMENTS
        const sidebarNav = document.getElementById('sidebar-nav');
        const controlsTableBody = document.getElementById('controls-table-body');
        const currentDomainTitle = document.getElementById('current-domain-title');
        const executiveSummary = document.getElementById('executive-summary');

        // INITIALIZATION
        function init() {
            renderSidebar();
            updateDashboard();
            initChart();
            document.getElementById('last-updated').textContent = new Date().toLocaleDateString();
        }

        function renderSidebar() {
            let html = `
                <a href="#" onclick="switchDomain('executive')" class="flex items-center px-6 py-3 text-sm font-medium transition-colors hover:text-white ${currentDomainId === 'executive' ? 'sidebar-item-active text-white' : ''}">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Executive Summary
                </a>
                <div class="mt-4 mb-2 px-6 text-xs font-semibold text-slate-500 uppercase tracking-widest">Domains</div>
            `;

            domains.forEach(domain => {
                html += `
                    <a href="#" onclick="switchDomain('${domain.id}')" class="flex items-center px-6 py-3 text-sm font-medium transition-colors hover:text-white ${currentDomainId === domain.id ? 'sidebar-item-active text-white' : ''}">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        ${domain.name}
                    </a>
                `;
            });

            sidebarNav.innerHTML = html;
        }

        function switchDomain(id) {
            currentDomainId = id;
            renderSidebar();
            updateDashboard();
        }

        function updateDashboard() {
            const counts = calculateStats();
            updateStatsUI(counts);
            updateChartData(counts);

            if (currentDomainId === 'executive') {
                currentDomainTitle.textContent = "Executive Summary";
                executiveSummary.classList.remove('hidden');
                renderAllControls();
            } else {
                const domain = domains.find(d => d.id === currentDomainId);
                currentDomainTitle.textContent = domain.name;
                executiveSummary.classList.add('hidden');
                renderDomainControls(domain);
            }
        }

        function calculateStats() {
            const counts = { "Pass": 0, "Fail": 0, "In Progress": 0, "Not Tested": 0, "N/A": 0, "Total": 0 };
            domains.forEach(d => {
                d.controls.forEach(c => {
                    counts[c.status]++;
                    counts["Total"]++;
                });
            });
            return counts;
        }

        function updateStatsUI(counts) {
            document.getElementById('total-controls-count').textContent = counts["Total"];
            document.getElementById('passed-count').textContent = counts["Pass"];
            document.getElementById('failed-count').textContent = counts["Fail"];
            document.getElementById('progress-count').textContent = counts["In Progress"];
            document.getElementById('not-tested-count').textContent = counts["Not Tested"];
            document.getElementById('na-count').textContent = counts["N/A"];
        }

        function renderAllControls() {
            let html = '';
            domains.forEach(domain => {
                html += `
                    <tr class="bg-slate-50/50">
                        <td colspan="4" class="px-6 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">${domain.name}</td>
                    </tr>
                `;
                domain.controls.forEach(control => {
                    html += renderControlRow(control, domain.id);
                });
            });
            controlsTableBody.innerHTML = html;
        }

        function renderDomainControls(domain) {
            let html = '';
            domain.controls.forEach(control => {
                html += renderControlRow(control, domain.id);
            });
            controlsTableBody.innerHTML = html;
        }

        function renderControlRow(control, domainId) {
            const statusClass = statusColors[control.status] || "";
            const isExpanded = control.expanded || false;

            return `
                <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="toggleControlDetails('${domainId}', '${control.id}')">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-slate-500">
                        <div class="flex items-center">
                            <svg class="w-4 h-4 mr-2 transition-transform ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            ${control.id}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-700">${control.description}</td>
                    <td class="px-6 py-4 whitespace-nowrap" onclick="event.stopPropagation()">
                        <select onchange="handleStatusChange('${domainId}', '${control.id}', this.value)"
                                class="text-xs font-semibold rounded-full px-3 py-1 border-none focus:ring-2 focus:ring-blue-500 cursor-pointer ${statusClass}">
                            ${statusOptions.map(opt => `<option value="${opt}" ${control.status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                        <div class="flex items-center">
                            <div class="h-7 w-7 rounded-full bg-slate-200 flex items-center justify-center text-[10px] font-bold text-slate-600 mr-2 uppercase">JD</div>
                            Audit Team A
                        </div>
                    </td>
                </tr>
                <tr class="${isExpanded ? '' : 'hidden'} bg-slate-50">
                    <td colspan="4" class="px-12 py-6 border-l-4 border-l-blue-500">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- Left: Setup -->
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Control Attributes (What to look for)</label>
                                    <textarea
                                        onclick="event.stopPropagation()"
                                        onchange="updateControlData('${domainId}', '${control.id}', 'attributes', this.value)"
                                        class="w-full h-24 p-3 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="e.g. Ensure all new users have manager approval email attached...">${control.attributes || ''}</textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Reference Samples</label>
                                    <div onclick="event.stopPropagation()" class="flex items-center justify-center w-full">
                                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-white hover:bg-slate-50 transition">
                                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                                <svg class="w-8 h-8 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                                <p class="mb-2 text-sm text-slate-500"><span class="font-semibold">Click to upload</span> reference sample</p>
                                                <p class="text-xs text-slate-400">PDF, Image, Word, or Excel</p>
                                            </div>
                                            <input type="file" class="hidden" onchange="updateControlData('${domainId}', '${control.id}', 'hasReference', true)" />
                                        </label>
                                    </div>
                                    ${control.hasReference ? '<p class="text-xs text-green-600 mt-2 flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Reference sample uploaded</p>' : ''}
                                </div>
                            </div>

                            <!-- Right: Evidence & Testing -->
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Evidence Folder Upload</label>
                                    <div onclick="event.stopPropagation()" class="flex items-center space-x-4">
                                        <label class="bg-white border border-slate-200 px-4 py-2 rounded-md text-sm font-medium text-slate-700 hover:bg-slate-50 cursor-pointer shadow-sm flex items-center">
                                            <svg class="w-4 h-4 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                                            Select Folder
                                            <input type="file" webkitdirectory directory multiple class="hidden" onchange="handleFolderUpload('${domainId}', '${control.id}', this.files)" />
                                        </label>
                                        <span class="text-xs text-slate-500">${control.evidenceCount || 0} files selected</span>
                                    </div>
                                </div>
                                <div class="pt-4 border-t border-slate-200">
                                    <button
                                        onclick="event.stopPropagation(); runControlTest(event, '${domainId}', '${control.id}')"
                                        class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold text-sm hover:bg-slate-800 transition shadow-lg flex items-center justify-center space-x-2">
                                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                        <span>Run Automated Testing</span>
                                    </button>
                                    <p class="text-[10px] text-slate-400 mt-2 italic text-center">AI-powered comparison of evidence against control attributes</p>
                                </div>

                                <div id="test-result-${control.id}" class="mt-4 hidden p-4 rounded-lg bg-white border border-slate-200">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs font-bold text-slate-500 uppercase">Analysis Result</span>
                                        <span id="test-badge-${control.id}" class="text-[10px] px-2 py-0.5 rounded-full font-bold"></span>
                                    </div>
                                    <p id="test-text-${control.id}" class="text-sm text-slate-600"></p>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        }

        function handleStatusChange(domainId, controlId, newStatus) {
            const domain = domains.find(d => d.id === domainId);
            const control = domain.controls.find(c => c.id === controlId);
            control.status = newStatus;
            updateDashboard();
        }

        function toggleControlDetails(domainId, controlId) {
            const domain = domains.find(d => d.id === domainId);
            const control = domain.controls.find(c => c.id === controlId);
            control.expanded = !control.expanded;
            updateDashboard();
        }

        function updateControlData(domainId, controlId, key, value) {
            const domain = domains.find(d => d.id === domainId);
            const control = domain.controls.find(c => c.id === controlId);
            control[key] = value;
            if (key !== 'attributes') updateDashboard();
        }

        function handleFolderUpload(domainId, controlId, files) {
            const domain = domains.find(d => d.id === domainId);
            const control = domain.controls.find(c => c.id === controlId);
            control.evidenceCount = files.length;
            updateDashboard();
        }

        function runControlTest(event, domainId, controlId) {
            const domain = domains.find(d => d.id === domainId);
            const control = domain.controls.find(c => c.id === controlId);

            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white mr-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Analyzing Evidence...';

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalContent;

                // Simulated Logic
                const outcomes = ["Pass", "Fail", "In Progress"];
                const result = outcomes[Math.floor(Math.random() * outcomes.length)];

                control.status = result;
                updateDashboard();

                const resultDiv = document.getElementById(`test-result-${control.id}`);
                const resultBadge = document.getElementById(`test-badge-${control.id}`);
                const resultText = document.getElementById(`test-text-${control.id}`);

                resultDiv.classList.remove('hidden');
                resultBadge.textContent = result === "In Progress" ? "REVIEW REQUIRED" : result.toUpperCase();

                if (result === "Pass") {
                    resultBadge.className = "text-[10px] px-2 py-0.5 rounded-full font-bold bg-green-100 text-green-700";
                    resultText.textContent = "AI analysis confirmed that evidence matches the defined control attributes. All 12 samples verified successfully.";
                } else if (result === "Fail") {
                    resultBadge.className = "text-[10px] px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-700";
                    resultText.textContent = "Comparison failed. 3 evidence files do not match the required authorization patterns specified in attributes.";
                } else {
                    resultBadge.className = "text-[10px] px-2 py-0.5 rounded-full font-bold bg-yellow-100 text-yellow-700";
                    resultText.textContent = "Analysis inconclusive. Manual reviewer question: 'The signature on Page 4 of User_Access_Log.pdf is illegible. Please confirm authorization.'";
                }
            }, 2000);
        }

        // CHART LOGIC
        function initChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: statusOptions,
                    datasets: [{
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: statusOptions.map(opt => chartColors[opt]),
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    cutout: '75%',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const value = context.raw;
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.label}: ${value} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
            updateDashboard(); // Initial update to populate chart
        }

        function updateChartData(counts) {
            if (!statusChart) return;
            statusChart.data.datasets[0].data = statusOptions.map(opt => counts[opt]);
            statusChart.update();
        }

        // START
